[project]
name = "remediation-agent"
version = "0.1.0"
description = "LangGraph remediation agent that consumes a deterministic orchestrator's vulnerability payload and fixes .NET/Java findings, pluggable to more ecosystems"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",
    "eagv3-s17code",
    "langchain-anthropic>=0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
remediation-agent = "remediation_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remediation_agent"]

[tool.uv.sources]
eagv3-s17code = { path = "../session-17/S17Code", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
